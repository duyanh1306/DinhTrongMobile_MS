services:
  server:
    image: ghcr.io/duyanh1306/dinhtrongmobile_ms-server:latest
    container_name: mobile_server
    ports:
      - "9999:9999"
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=development
      - PORT=9999
      - MONGODB_URI=mongodb://mongo:27017/dinh_trong_mobile
    depends_on:
      - mongo
    networks:
      - app-network
    restart: unless-stopped

  client:
    image: ghcr.io/duyanh1306/dinhtrongmobile_ms-client:latest
    container_name: mobile_client
    ports:
      - "3000:3000"
    build:
      context: ./client
      args:
        - REACT_APP_API_URL=http://server:9999/api
    environment:
      - REACT_APP_API_URL=http://server:9999/api
    depends_on:
      - server
    networks:
      - app-network
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    container_name: mobile_mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=dinh_trong_mobile
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

volumes:
  mongo_data:

networks:
  app-network:
    driver: bridge
